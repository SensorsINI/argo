# Power Control Configuration
# Orange Pi Zero 2W Power Control System Settings

# GPIO Configuration
gpio:
  chip: "gpiochip0"
  
  # GPIO line numbers (update these based on verify_gpio_pins.py output)
  lines:
    power_relay: 227    # PI3 (Pin 40) - !POW output
    power_button: 233   # PI9 (Pin 28) - !POW_BUT input
    green_led: 196      # PH4 (Pin 18) - Green LED
    blue_led: 225       # PI1 (Pin 12) - Blue LED

# Power Button Settings
power_button:
  shutdown_threshold: 1.0  # Seconds to hold for shutdown
  debounce_time: 0.01      # Button polling interval
  external_pullup: true    # External pullup resistor present

# LED Settings
leds:
  blink_fast: 0.1          # Fast blink rate (seconds)
  blink_slow: 0.5          # Slow blink rate (seconds)
  shutdown_blink_duration: 5.0  # How long to blink during shutdown

# Power Relay Settings
relay:
  open_drain: true         # Use open drain configuration
  active_low: true         # Low = energized (relay on)
  startup_delay: 0.5       # Delay before energizing on startup
  shutdown_delay: 2.0      # Delay before de-energizing on shutdown

# Logging
logging:
  level: "INFO"            # DEBUG, INFO, WARNING, ERROR
  file: "/var/log/power_control.log"
  max_size: "10MB"
  backup_count: 5

# Safety Settings
safety:
  require_root: true       # Require root privileges
  graceful_shutdown: true  # Perform graceful shutdown before cutting power
  shutdown_timeout: 30     # Maximum time to wait for shutdown (seconds)

