# Argo WiFi Configuration
# Faster scanning and improved reconnection behavior
# This file is installed to /etc/NetworkManager/conf.d/argo_wifi_scan.conf

[device]
# Disable random MAC addresses for better network recognition
wifi.scan-rand-mac-address=no

[connection]
# Scan for networks every 30 seconds (default is 120 seconds)
wifi.scan-interval=30

# Enable roaming for better network switching
wifi.roam-threshold=70

[main]
# Enable connection sharing for better network management
no-auto-default=*

