# Argo WiFi Configuration
# Conservative settings to prevent aggressive reconnection attempts
# This file is installed to /etc/NetworkManager/conf.d/argo_wifi_scan.conf

[device]
# Disable random MAC addresses for better network recognition
wifi.scan-rand-mac-address=no

[connection]
# Use default scan interval (120 seconds) to prevent aggressive scanning
# wifi.scan-interval=120  # Default value, commented out

# Disable aggressive roaming to prevent frequent connection attempts
# wifi.roam-threshold=70  # Commented out to use default behavior

[main]
# Enable connection sharing for better network management
no-auto-default=*

