# Centralized configuration file for all Argo nodes
# (there are a few other config files in the nodes directory, but this is the main one, see also README.md)

# NOTE code should use ruamel for yaml parsing, not standard yaml library, to preserve comments and ordering
# Global parameters (applied to all nodes)
# The /** wildcard is ROS2 parameter syntax that applies these parameters to ALL nodes
/**:
  ros__parameters:
    # Map configuration (used by sailing_area_publisher, argo_transform_publisher, controllers)
    # See https://www.google.com/maps/d/ for the source maps. See docs/README-adding-sailing-maps.md for more information.
    geofence_map_name: Argo Irchel North pond sailing area  # Risi | Argo Irchel pond sailing area | Argo Pool Hotel dek Pini | behind INI | Hotel dei Pini | Hotel dei Pini close to shore
    gps_spike_max_speed_mps: 3.0  # argo_transform_publisher: reject /fix jumps implying speed above this (m/s)
    # Controller parameters (used by controller.py and crosser controller)
    p_heading_gain: 0.8  # Proportional gain for heading control (P controller, can be extended to PID)
    min_rudder_near_boundary: 0.5  # Minimum rudder command when close to boundary (0.0-1.0)
    boundary_emergency_threshold: 3.0  # Meters from boundary for emergency turn
    turn_rudder_gain_multiplier: 2.0  # Multiplier for rudder gain during turns (more aggressive control)
    argo:
      mode: autonomous  # NOTE: Currently unused - launch mode controlled via launch argument (normal/simulation)
    # Simulation parameters (shared across simulator bridge, transform publisher, and visualization)
    # These are accessible to all nodes via the simulation.* namespace
    simulation:
      publish_rate: 2.0         # Standard publishing rate for sensors, transforms, and visualization (Hz)
      simulation_rate: 10.0     # Simulation step rate (Hz) - higher than publish_rate for accurate physics
      heading_trail_limit: 200  # Number (roughly) of historical heading markers to display in visualization
      grounding_behavior: reset # Behavior on grounding in local simulation: reset|terminate|continue
      # Sensor noise modeling for sim-to-real gap reduction
      # Set all noise parameters to 0.0 to disable noise (perfect sensors)
      sensor_noise:
        enabled: true  # Master switch for all sensor noise (set to true for realistic simulation)
        # Wind sensor (anemometer) noise parameters
        wind:
          use_apparent_wind: false  # If true, simulate apparent wind (true_wind - boat_velocity), if false use true wind
          angle_noise_stddev: 5.0   # Standard deviation of wind angle noise (degrees)
          angle_bias: 0.0           # Constant bias/offset in wind angle (degrees)
          speed_noise_stddev: 0.5   # Standard deviation of wind speed noise (m/s)
          speed_bias: 0.0           # Constant bias/offset in wind speed (m/s)
          update_rate: 4.0          # Sensor update rate (Hz) - real anemometer typically 1-10 Hz
          dropout_probability: 0.0  # Probability of sensor dropout per update (0.0-1.0)
          dropout_duration: 1.0     # Duration of dropout events (seconds)
        # Compass/IMU noise parameters
        compass:
          heading_noise_stddev: 2.0  # Standard deviation of heading noise (degrees)
          heading_bias: 0.0          # Constant bias/offset in heading (degrees) - simulates miscalibration
          heading_drift_rate: 0.1    # Heading drift rate (degrees/minute) - simulates gyro drift
          update_rate: 10.0          # Sensor update rate (Hz)
          magnetic_interference_stddev: 5.0  # Additional noise near metal/electronics (degrees)
        # GPS noise parameters
        # Values based on analysis of pond recording (argo_20251117_114846 first irchel pond in rain)
        gps:
          position_noise_stddev: 0.1  # Standard deviation of position noise (meters) - measured: 0.51m from pond recording
          cog_noise_stddev: 1.0       # Course over ground noise (degrees) - measured: 44.64° at low speeds, using conservative value
          sog_noise_stddev: 0.005       # Speed over ground noise (m/s) - measured: 0.156 m/s from pond recording
          update_rate: 0.2            # GPS update rate (Hz) - measured: ~0.2 Hz (1/5 Hz) from pond recording, critical for sim2real gap
          noise_time_constant: 10.0    # Time constant for noise filtering (seconds) - measured: 3.01s from pond recording
          dropout_probability: 0.0    # Probability of GPS fix loss per update
          dropout_duration: 2.0       # Duration of GPS dropout (seconds)
        # IMU accelerometer/gyro noise (for roll/pitch)
        imu:
          accel_noise_stddev: 0.1     # Accelerometer noise (m/s²)
          gyro_noise_stddev: 0.05     # Gyroscope noise (rad/s)
          update_rate: 100.0          # IMU update rate (Hz) - typically 50-400 Hz
        # Sensor latency (time delays)
        latency:
          wind_latency_ms: 100        # Wind sensor processing delay (milliseconds)
          compass_latency_ms: 50      # Compass/IMU processing delay (milliseconds)
          gps_latency_ms: 500         # GPS processing delay (milliseconds)
      # Mock simulator physics parameters (used when sailboat-playground is unavailable)
      mock_simulator:
        max_turn_rate: 30.0  # Degrees per second at full rudder and speed
        max_speed: 1.5  # Metres per second (approximate hull speed)
        no_go_angle_deg: 45.0  # Approximate close-hauled limit (degrees from wind)
        stall_decay_rate: 1.5  # m/s^2 equivalent deceleration while stalled
        stall_recovery_threshold: 0.1  # m/s; once above this we treat stall as cleared
        tack_entry_buffer_deg: 12.0  # Allow tacks to begin slightly before the no-go boundary
        tack_exit_buffer_deg: 6.0  # Required clearance before finishing a tack
        tack_speed_threshold: 0.35  # m/s minimum speed to initiate a tack
        tack_min_speed_to_continue: 0.25  # m/s minimum to keep crossing the wind
        tack_time_limit_s: 8.0  # Abort tack if it takes longer than this
        tack_turn_boost: 1.8  # Multiplier applied to turn rate during a tack window (increased for more aggressive tacks)
      # Wind characteristics (runtime configurable via ROS2 parameters)
      wind:
        wind_min_speed: 4.0         # Minimum wind speed in m/s (used for mock simulator). 1m/s is about 2 knots.
        wind_max_speed: 10.0        # Maximum wind speed in m/s (placeholder for variable wind)
        wind_direction: 220.0      # Degrees CW from North (compass, 0°=North), where wind COMES FROM
        # Placeholder parameters for future wind variability features:
        wind_max_delta_percent: 0.0        # Max wind speed variation percent (placeholder)
        wind_gust_probability: 0.0         # Probability of gusts (0.0-1.0, placeholder)
        wind_gust_min_duration: 3.0        # Min gust duration (s, placeholder)
        wind_gust_max_duration: 20.0       # Max gust duration (s, placeholder)
        wind_gust_min_speed: 4.0           # Min gust speed (m/s, placeholder)
        wind_gust_max_speed: 7.0           # Max gust speed (m/s, placeholder)
        wind_gust_max_delta_percent: 10.0  # Max gust speed variation percent (placeholder)
    # ----------------------------------------------------------------------------
    # IMU heading (bno085.py) — fusion quaternion is mag-north referenced after ellipsoid cal
    # - mount_forward_axis: bow direction in sensor frame (+Y on PCB, +X starboard, +Z up)
    # - mount_yaw_deg: extra rotation in sensor XY plane if PCB is rotated about vertical axis
    # - yaw_offset_deg: fine trim only (declination, sub-degree alignment); default 0
    # - yaw_invert: if N/S correct but E/W swapped, set true; test bow E/W (no change at N/S)
    # - Reload IMU config: sudo systemctl restart argo_bno085.service
    #   (ars / argo_launch restart does NOT restart the BNO085 bridge — separate service)
    # - /compass: 0°=North, 90°=East (CW). /pose.z: ENU math yaw; compass = (450 - pose.z) % 360
    # ----------------------------------------------------------------------------
    imu:
      mount_forward_axis: y
      mount_yaw_deg: 0.0
      yaw_offset_deg: 0.0
      yaw_invert: false # verified correct in lab, dashboard display at least roughly correct
controller_node:
  ros__parameters:
    controller_type: human  # Options: proportional, wind_aware, return_to_home, crosser, human
    data_collection_enabled: false  # Enable training data recording for machine learning (used by controller.py)
    rudder_gain: 0.3  # Proportional gain for rudder control (formula: rudder_cmd = gain * heading_error / rudder_full_scale_deg)
    rudder_full_scale_deg: 60.0  # Heading error (degrees) that produces full rudder deflection (-1.0 to +1.0)
    param_file_path: argo.yaml
    patrol_lookahead_time: 15.0  # Seconds to predict ahead for boundary crossing (crosser controller)
    boundary_turn_threshold: 4.0  # Distance to boundary (meters) to trigger turn maneuver
    tack_angle: 120.0  # Degrees to turn for jibe / compass-based turn candidates at boundary (NOT close-hauled laylines)
    upwind_layline_angle_deg: 50.0  # Crosser only: angle from true wind for upwind tacking headings (close-hauled; must be > no_go_zone_angle/2)
    tack_cooldown_s: 20.0  # Crosser tacking_upwind: minimum seconds after last switch before another is allowed
    tacking_upwind_on_target_deg: 15.0  # Crosser: max heading error (deg) to count as "on" current layline
    tacking_upwind_stable_before_switch_s: 4.0  # Crosser: seconds continuously on layline before switching (reduces rapid short-tacking)
    arrival_distance_m: 3.0  # Distance to middle waypoint (meters) to consider "arrived" (used by crosser controller)
    tack_min_angle_from_wind: 50.0  # Minimum angle from wind during tack to avoid stays (degrees, used by crosser controller)
    no_go_zone_angle: 45.0  # Angle from wind where sailing is impossible (degrees, used by crosser controller)
    rth_on_wifi_loss: true  # Temporarily switch to return_to_home when /wifi_health goes false (keeps boat in WiFi range)

anem_node:
  ros__parameters:
    # Zero-wind baseline DP (Pa) on raw I2C — subtracted before DP_SIGN_CORRECTION.
    # Measure with no airflow: `python3 nodes/anem.py --debug`, average dp_raw over ~30 s.
    dp_offset_ctr: -0.0247  # CTR 0x22, 0° (mean dp_raw, calm, 31 samples 2026-05-26)
    dp_offset_cw: -0.0025   # CW 0x21, +120°
    dp_offset_ccw: 0.0007   # CCW 0x23, −120°
    calm_speed_threshold_mps: 0.10  # Report 0 m/s when calibrated speed is below this

gps_node:
  ros__parameters:
    # Line 229 (pin 24) is SPI1_CS0 on default overlay; node skips if kernel owns it. Use -1 to disable.
    pps_gpio_line: 229
    # Hardware reset on startup (recommended: true)
    # Performs a hardware reset of the GPS module on node startup to ensure clean state.
    # This helps recover from GPS module state corruption that can occur during operation,
    # which manifests as satellites visible but no fix acquisition. Without this, a manual
    # node restart may be required to recover from this state.
    hardware_reset_on_startup: true

rudder_sail_radio_node:
  ros__parameters:
    human_override_timeout: 8.0      # Seconds after last human activity before robot can take control
    deadband_threshold: 0.25          # Rudder: |pos|>threshold; Sail: only Δsail>threshold (2 reads) — see rudder_sail_radio.py
    # Rudder: measure radio endpoints at full stick (watch radio_rudder_pw_us). cmd -1/+1 uses these;
    # crosser/human PWM output maps cmd -1/+1 to servo_* endpoints (amplifies throw vs radio).
    # release_servos=true (HumanController) bypasses this — radio drives servo directly.
    radio_rudder_min_pw: 1100.0
    radio_rudder_max_pw: 1900.0
    servo_rudder_min_pw: 900.0    # kernel minimum (argo_radio_servo_module)
    servo_rudder_max_pw: 2100.0   # kernel maximum
    safety_max_sail: 1.0        # Sail: normalized cap; PWM still 1500±500us per unit
    param_file_path: argo.yaml
argo_boat_visualization:
  ros__parameters:
    visualization_scale: 6.0        # Scale factor for boat visualization (1.0 realistic)
