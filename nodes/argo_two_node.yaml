# Configuration for two-node Argo control system
# - controller.py: High-level autonomous control 
# - rudder_sail_radio.py: Low-level hardware control and human/robot arbitration

# High-level controller node
controller_node:
  ros__parameters:
    # Controller selection - easily switch between different algorithms
    controller_type: "proportional"  # Options: "proportional", "wind_aware"
    
    # Data collection for training
    data_collection_enabled: false  # Set to true to collect training data during human control
    
    # Basic control parameters
    rudder_gain: 2.0
    rudder_full_scale_deg: 60.0
    
    # Parameter file path (for dynamic reloading)
    param_file_path: "argo_two_node.yaml"

# Low-level rudder/sail control and arbitration node
rudder_sail_radio_node:
  ros__parameters:
    # Human/robot arbitration timing
    human_override_timeout: 2.0      # Seconds after last human activity before robot can take control
    deadband_threshold: 0.05         # Minimum change in radio input to count as human activity
    
    # Safety limits
    safety_max_rudder: 1.0          # Maximum rudder command magnitude
    safety_max_sail: 1.0            # Maximum sail command magnitude
    
    # Parameter file path
    param_file_path: "argo_two_node.yaml"

# Alternative configurations for different scenarios:

