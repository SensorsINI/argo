bno08x_ros:
  ros__parameters:

    frame_id: "imu_link"  # Frame ID for Argo sailboat IMU

    # Communication Interface
    # I2C bus 0 on Orange Pi Zero 2W
    i2c:
      enabled: true
      bus: "/dev/i2c-0"  # Orange Pi Zero 2W uses i2c-0
      address: "0x4A"    # BNO085 default I2C address

    publish:
      magnetic_field: 
        enabled: true
        rate: 1   # Hz for magnetic field (compass heading)
      imu:
        enabled: true
        rate: 5   #  Hz for IMU data (accel, gyro, orientation)

